# GPUCloud Production Nginx Configuration
# Place this in /etc/nginx/sites-available/gpucloud

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=web:10m rate=30r/s;

# Upstream backend servers
upstream api_backend {
    server 127.0.0.1:8080;
    # Add more API servers for load balancing
    # server 127.0.0.1:8081;
    # server 127.0.0.1:8082;
}

upstream web_backend {
    server 127.0.0.1:3000;
    # Add more web servers for load balancing
    # server 127.0.0.1:3001;
}

# Main server block (HTTP)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    # API endpoints (with rate limiting)
    location /v1/ {
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        
        # Proxy to API backend
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Health check endpoint (no rate limiting)
        location /v1/health {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://api_backend;
        }
    }
    
    # Frontend static files
    location / {
        # Rate limiting
        limit_req zone=web burst=50 nodelay;
        
        # Proxy to web backend
        proxy_pass http://web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            proxy_pass http://web_backend;
        }
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://api_backend;
    }
}

